[package]
name = "f_pdf"
version = "0.1.0"
edition = "2024"
authors = ["happyboy <superhappyboy1995@gmail.com>"]
description = "A Rust PDF document parsing engine, with FPDF at its core, providing complete document structure decomposition and read/write capabilities."
keywords = ["pdf", "document"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/0xhappyboy/f_pdf"

[dependencies]
flate2 = "1.1.11"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

[dev-dependencies]
ureq = "3.5.2"

